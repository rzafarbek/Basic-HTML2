  <h1>Chocolate Cake Recipe</h1>

  <p>This is a simple and delicious chocolate cake recipe.</p>

  <h2>Ingredients</h2>
  <ul>
    <li>Flour</li>
    <li>Sugar</li>
    <li>Cocoa powder</li>
    <li>Eggs</li>
  </ul>

  <h2>Instructions</h2>
  <ol>
    <li>Mix all dry ingredients.</li>
    <li>Add eggs and mix well.</li>
    <li>Bake in the oven.</li>
    <li>Let it cool and serve.</li>
  </ol>
